[flake8]
max-line-length = 120
max-complexity = 12
extend-ignore = E203, W503, E501, B950
exclude =
    .git,
    .venv,
    __pycache__,
    build,
    dist,
    data,
    .eggs
per-file-ignores =
    __init__.py: F401
    tests/*: S101

[tool:pytest]
minversion = 8.0
testpaths = tests
addopts = -ra -q
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:pandas.*
    ignore::DeprecationWarning:pyarrow.*
