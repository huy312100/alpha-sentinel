  # ---------------------------------------------------------------------------
  # Listed markets. Same pipeline, same veto hierarchy; the crypto-only layers
  # (onchain, dex, airdrop, social, derivatives, security) self-skip and the
  # market + fundamentals layers take over.
  # ---------------------------------------------------------------------------
  equities:
    description: US large caps - venue microstructure plus issuer fundamentals.
    asset_class: equity
    venue: us_equity
    instruments:
      - symbol: AAPL
        tags: [mega-cap, technology]
        priority: 60
      - symbol: MSFT
        tags: [mega-cap, software]
        priority: 62
      - symbol: JPM
