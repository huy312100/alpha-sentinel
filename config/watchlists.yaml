        tags: [l2, governance]
        priority: 40

  solana:
    description: Solana majors - only the DEX/technical/wash layers apply.
    tokens:
      - symbol: JUP
        address: "JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN"
        chain: solana
        tags: [dex, solana]
        priority: 30
      - symbol: BONK
        address: "DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263"
        chain: solana
        tags: [meme, solana]
        priority: 50

  research:
    description: Lower-priority names; only scanned when the cycle cap allows.
    tokens:
      - symbol: SHIB
        address: "0x95aD61b0a150d79219dCF64E1E6Cc01f0B64C4cE"
        tags: [meme]
        priority: 80
      - symbol: MATIC
        address: "0x7D1AfA7B718fb893dB30A3aBc0Cfc608AaCfeBB0"
        tags: [l2, legacy]
        priority: 80
