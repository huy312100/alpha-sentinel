# =============================================================================
# AlphaSentinel watchlists
#
# Every instrument listed here is scanned once per cycle (subject to cooldown and
# the per-cycle cap). One file drives every market: crypto contracts, equities,
# ETFs, indices, FX pairs, commodity futures and rates.
#
# Two identity rules, enforced at load time:
#   * crypto       -> ``address`` (contract) + ``chain``. Tickers collide,
#                     contracts do not.
#   * other markets-> ``symbol``. A provider symbol (``EURUSD=X``, ``GC=F``,
#                     ``^GSPC``) is derived from the asset class and can be
#                     overridden with ``provider_symbol``.
#
# Fields per entry (identity is the only requirement):
#   address        contract address (EVM: 0x + 40 hex, Solana: base58) - crypto
#   symbol         ticker (required for non-crypto; display hint for crypto)
#   asset_class    crypto|equity|etf|index|fx|commodity|rate (default: defaults.asset_class)
#   chain          chain slug for crypto - defaults to ``defaults.chain``
#   venue          exchange/bucket slug for non-crypto (us_equity, fx, futures...)
#   provider_symbol override the derived data-provider symbol
#   tags           free-form labels for filtering in the dashboard
#   priority       lower number = scanned first when the cap is hit
#   cooldown_hours minimum hours between two scans of the same instrument
#
# A watchlist section may set ``asset_class``/``venue`` once for all its entries,
# and may use ``instruments:`` instead of ``tokens:``.
# =============================================================================

version: 1

defaults:
  asset_class: crypto
  chain: ethereum
  cooldown_hours: 6.0
  priority: 100

settings:
  # Hard cap per cycle. The engine truncates by priority, then symbol.
  max_tokens_per_cycle: 60

watchlists:
  core:
    description: Deep-liquidity majors used as the canary set for every cycle.
    tokens:
      - symbol: WETH
        address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
        tags: [major, collateral]
        priority: 10
      - symbol: PEPE
        address: "0x6982508145454Ce325dDbE47a25d4ec3d2311933"
        tags: [meme, high-volume]
        priority: 20
      - symbol: UNI
        address: "0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984"
        tags: [defi]
        priority: 40
      - symbol: LINK
        address: "0x514910771AF9Ca656af840dff83E8264EcF986CA"
        tags: [oracle, defi]
        priority: 40

  l2:
