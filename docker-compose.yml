# =============================================================================
# AlphaSentinel - local/prod stack: scanner bot + read-only dashboard.
#   cp .env.example .env   # fill in keys (DEMO_MODE=true needs none)
#   docker compose up -d --build
# =============================================================================
name: alpha-sentinel

x-service: &service
  build:
    context: .
    dockerfile: Dockerfile
  image: alpha-sentinel:local
  env_file:
    - path: .env
      required: false
  restart: unless-stopped
  # Bounded logs. Docker's json-file driver is unbounded by default, so a
  # seven-day soak of a JSON-logging daemon eventually fills the host disk -
  # and it fills it on the one run that exists to prove the service is
  # trustworthy unattended. 20m x 5 keeps ~100MB per container, which is days
  # of cycle logs at the default interval.
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  volumes:
    - ./data:/app/data
    - ./config/watchlists.yaml:/app/config/watchlists.yaml:ro
    # Optional: mount an endpoint catalogue overlay (the ConfigMap equivalent)
    # and point ENDPOINTS_FILE at it; entries merge over config/endpoints.yaml.
    # - ./config/endpoints.local.yaml:/etc/alphasentinel/endpoints.yaml:ro
  environment:
    DATA_DIR: /app/data
    HOT_DB_PATH: /app/data/hot/alpha_sentinel.db
    PARQUET_ROOT: /app/data/cold
    LOG_JSON: "true"

services:
  bot:
    <<: *service
    container_name: alpha-sentinel-bot
    command: ["python", "-m", "bot.main", "--daemon"]
    stop_grace_period: 30s

  dashboard:
    <<: *service
    container_name: alpha-sentinel-dashboard
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      # Loopback by default: the dashboard has no accounts, so publishing it on
      # 0.0.0.0 is a deliberate act, not an accident of `docker compose up` on a
      # cloud host. Set DASHBOARD_BIND=0.0.0.0 only together with
      # DASHBOARD_PASSWORD, which turns on the dashboard's unlock form.
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      bot:
        condition: service_started
    healthcheck:
      # Pure-stdlib probe: the image ships no curl, so the dashboard must not need one.
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
