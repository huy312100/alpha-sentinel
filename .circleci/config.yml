# =============================================================================
# CircleCI - lint, hermetic tests, and a container build for every push.
# The test suite needs no network and no credentials: it is the release gate.
# =============================================================================
version: 2.1

executors:
  py311:
    docker:
      - image: cimg/python:3.11
    resource_class: medium

commands:
  install-deps:
    steps:
      # Cache the *wheel* cache, never the virtualenv. The cimg tag is mutable,
      # so a restored .venv can outlive the interpreter it was built with and
      # leave .venv/bin/python dangling: on 2026-10-27 that killed "Install
      # pinned dependencies" (exit 1, "No such file or directory") in both the
      # lint and test jobs while the cache itself restored "successfully".
      - restore_cache:
          keys:
            - v2-pip-{{ arch }}-{{ checksum "requirements.txt" }}
            - v2-pip-{{ arch }}-
      - run:
          name: Install pinned dependencies
          command: |
            python -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt
      - save_cache:
          key: v2-pip-{{ arch }}-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip

jobs:
  lint:
    executor: py311
    steps:
      - checkout
      - install-deps
      - run:
          name: flake8 (must be zero findings)
          command: .venv/bin/python -m flake8 . --count --statistics
      - run:
          name: Byte-compile every module
          command: .venv/bin/python -m compileall -q bot core config scanners storage ai_engine dashboard tests

  test:
    executor: py311
    steps:
      - checkout
      - install-deps
      - run:
          name: pytest (hermetic, DEMO_MODE)
          # Record the status instead of failing here: a non-zero exit would stop
          # the job before the JUnit report is stored, leaving a red build with
          # no clue which test died. The last step re-raises the status.
          command: |
            mkdir -p test-results
            set +e
            .venv/bin/python -m pytest tests/ -q --junitxml=test-results/junit.xml
            echo $? > /tmp/pytest.exit
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
      - run:
          name: Propagate the pytest status
          command: exit $(cat /tmp/pytest.exit)

  docker-build:
    executor: py311
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build the runtime image
          command: docker build --tag alpha-sentinel:${CIRCLE_SHA1:0:7} .
      - run:
          name: Smoke the image (status command, no credentials)
          command: |
            docker run --rm \
              -e DEMO_MODE=true \
              -e TELEGRAM_BOT_TOKEN= \
              -e TELEGRAM_CHAT_ID= \
              alpha-sentinel:${CIRCLE_SHA1:0:7} python -m bot.main --status
      - run:
          name: The image refuses to boot on an invalid configuration (exit 2)
          # The boot gate is the point of the image: a production container with
          # no LLM key must die during start-up, not serve half a cycle.
          command: |
            set +e
            timeout 120 docker run --rm \
              -e APP_ENV=production \
              -e DEMO_MODE=false \
              -e LLM_API_KEY= \
              alpha-sentinel:${CIRCLE_SHA1:0:7} python -m bot.main --once --limit 1
            status=$?
            echo "boot gate exit status: ${status}"
            test "${status}" -eq 2

workflows:
  ci:
    jobs:
      - lint
      - test
      - docker-build
