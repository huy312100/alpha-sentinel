# =============================================================================
# AI code review that costs nothing and needs no account.
#
# CodeRabbit is quota-bound: when the monthly allowance runs out, PRs go
# unreviewed until the cycle turns over. Every hosted alternative trades that
# quota for a per-token bill or an API key we would have to provision, rotate
# and keep out of a public repo. So this workflow brings its own model instead:
# PR-Agent reviews the diff against a small language model served by Ollama on
# the runner itself. No key, no secret, no invoice - and on a public repository
# the runner minutes are free as well.
#
# The trade is quality and latency, and it is real. A 7B model on four CPU cores
# reads a diff less carefully than a frontier model over the network, and a
# review takes minutes instead of seconds. Expect it to catch the mechanical
# class of defect - unvalidated input, swallowed exceptions, secrets in logs,
# tests that reach the network - and not to catch the subtle one. It advises;
# `Lint + hermetic tests`, CodeQL and CircleCI still decide whether a PR merges.
#
# Tunable from repository settings, no edit required:
#   Settings > Secrets and variables > Actions > Variables
#     AI_REVIEW_MODEL    any Ollama model id (default qwen2.5-coder:7b-instruct-q4_K_M)
#     AI_REVIEW_ENABLED  'false' turns the workflow off; anything else leaves it on
#
# Fork PRs are skipped: on `pull_request` GitHub hands fork workflows a
# read-only token, so a review could be computed but never posted. Do not switch
# this file to `pull_request_target` to "fix" that - it would run against an
# attacker-controlled tree with a write token in scope.
# Setup, model choices and troubleshooting: .github/AI_REVIEW.md
# =============================================================================
name: AlphaSentinel AI review

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
    # Same filters as .coderabbit.yaml: artifacts and scratch data are not code.
    paths-ignore:
      - "data/**"
      - "tmp/**"
      - "**/*.parquet"
      - "**/*.db"
  # /review, /describe, /improve and /ask arrive here.
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  # A force-push mid-review must not leave two comments quoting two different
  # diffs, so each push review cancels the previous one. The group carries two
  # extra discriminators, and it has to. GitHub matches the group when the run is
  # created, before the job-level `if:` below runs:
  #   1. the event name and the sender type, because CodeRabbit commenting on the
  #      PR and PR-Agent posting its own progress comment mid-run both arrive as
  #      `issue_comment`; with a single per-PR group that bot chatter cancelled
  #      the review that was running (observed on PR #14);
  #   2. whether an `issue_comment` is actually a command, because a comment like
  #      "LGTM" would otherwise cancel a 25-minute /review - and the run that
  #      replaced it then skips on the `if:` and posts nothing at all.
  # Command comments keep the plain group, so a push still cancels an in-flight
  # review and two commands still supersede each other.
  group: >-
    ai-review-${{ github.event_name }}-${{ github.event.sender.type }}${{
    (github.event_name == 'issue_comment' &&
    !(startsWith(github.event.comment.body, '/review') ||
    startsWith(github.event.comment.body, '/describe') ||
    startsWith(github.event.comment.body, '/improve') ||
    startsWith(github.event.comment.body, '/ask'))) && '-noise' || '' }}-${{
    github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

env:
  # The model that does the reviewing. Larger models read diffs better and run
  # slower; .github/AI_REVIEW.md lists the sizes that fit a standard runner.
  OLLAMA_MODEL: ${{ vars.AI_REVIEW_MODEL || 'qwen2.5-coder:7b-instruct-q4_K_M' }}
  OLLAMA_URL: http://127.0.0.1:11434
  # Pinned like PR_AGENT_VERSION: the review depends on the server's behaviour
  # (context sizing, the `/api/show` readiness probe, the manifest format under
  # ~/.ollama), and `latest` would change all three without a diff to point at.
  # Bumping this also refetches the weights, because the cache key includes it.
  OLLAMA_VERSION: "0.40.13"
  # The model's window must clear the budget PR-Agent is willing to send, or the
  # excess is dropped silently and the review describes a diff it never saw.
  # Ollama sizes its context from available VRAM, i.e. 4k on a CPU-only runner,
  # which is why this is explicit. 24k at ~56 KB of KV cache per token is ~1.4 GB
  # on top of the 4.7 GB of weights - comfortable inside 16 GB.
  OLLAMA_CONTEXT_LENGTH: "24576"
  # Pinned: the review text is parsed as structured JSON, so a silent upstream
  # format change would degrade into "no findings" rather than an error.
  PR_AGENT_VERSION: "0.49.0"
  # Diff budget, sized from measured throughput: this model prefills at ~13.7
  # tokens/second on a 4 vCPU runner, so 16384 buys ~20 minutes before the first
  # output token. Cheaper budgets were tried and are worse: 8192 dropped both
  # files this PR changed, and 10240 still dropped the workflow file - while the
  # comment went on to report "no major issues detected". Coverage is worth the
  # wait; past the budget PR-Agent still names whatever it had to drop.
  PR_AGENT_MAX_TOKENS: "16384"

jobs:
  local-review:
    name: Local review (Ollama)
    # Cheap early exit: a comment that is not a review command, or one written by
    # a bot, never needs a runner at all. The gate below re-checks every case and
    # is what emits a human-readable notice.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != null &&
       github.event.sender.type != 'Bot' &&
       (startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/describe') ||
        startsWith(github.event.comment.body, '/improve') ||
        startsWith(github.event.comment.body, '/ask')))
    runs-on: ubuntu-latest
    # A cold run pulls ~4.7 GB of weights, and a full-budget diff spends ~12
    # minutes in prefill alone at the measured 13.7 tokens/second. The inner
    # ceiling is CONFIG__AI_TIMEOUT below; this outer one leaves room for the
    # weight download and for one full retry.
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Decide whether this event is reviewable
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          SKIPPED_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-ai-review') }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
          ISSUE_HTML_URL: ${{ github.event.issue.html_url }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER_ASSOC: ${{ github.event.comment.author_association }}
        run: |
          set -euo pipefail
          # A reviewer that does not apply here must leave the job green: it is
          # not a required check and must never be able to block a merge.
          emit_skip() {
            echo "::notice::$1"
            {
              echo "skip=true"
              echo "pr_url="
              echo "command=review"
              echo "question="
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "${AI_REVIEW_ENABLED:-}" = "false" ]; then
            emit_skip "AI review is disabled (vars.AI_REVIEW_ENABLED=false)."
          fi

          command=review
          question=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Not a secret problem: the model runs locally, but a fork gets a
            # read-only GITHUB_TOKEN, so the review could not be posted.
            if [ "${IS_FORK:-}" = "true" ]; then
              emit_skip "Fork PR: GitHub issues a read-only token, so no review can be posted."
            fi
            if [ "${IS_DRAFT:-}" = "true" ]; then
              emit_skip "Draft PR: review starts when it is marked ready."
            fi
            if [ "${SKIPPED_LABEL:-}" = "true" ]; then
              emit_skip "PR carries the skip-ai-review label."
            fi
            pr_url="$PR_HTML_URL"
          else
            if [ "${ISSUE_IS_PR:-}" != "true" ]; then
              emit_skip "Comment is not on a pull request."
            fi
            # Without this gate anyone could drive a review by commenting on a
            # public PR, spending runner minutes on someone else's behalf.
            case " OWNER MEMBER COLLABORATOR " in
              *" ${COMMENTER_ASSOC:-none} "*) ;;
              *) emit_skip "Only OWNER/MEMBER/COLLABORATOR commenters can trigger a review." ;;
            esac
            first_line="${COMMENT_BODY%%$'\n'*}"
            word="${first_line%% *}"
            case "$word" in
              /review*) command=review ;;
              /describe*) command=describe ;;
              /improve*) command=improve ;;
              /ask*)
                command=ask
                question="${first_line#"$word"}"
                question="${question# }"
                ;;
              *) emit_skip "Not a review command (expected /review, /describe, /improve or /ask)." ;;
            esac
            pr_url="$ISSUE_HTML_URL"
          fi

          {
            echo "skip=false"
            echo "pr_url=$pr_url"
            echo "command=$command"
            echo "question=$question"
          } >> "$GITHUB_OUTPUT"

      # Weights are the slow part of a cold run and never change for a given
      # tag, so they survive between runs. Caches are free for public repos.
      - name: Restore the model cache
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          # The server version is part of the key: a manifest written by one
          # Ollama release is not guaranteed to load in another.
          key: ollama-${{ env.OLLAMA_VERSION }}-${{ env.OLLAMA_MODEL }}

      - name: Start Ollama
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          docker run -d --name ollama \
            -p 127.0.0.1:11434:11434 \
            -v "$HOME/.ollama:/root/.ollama" \
            -e OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH" \
            -e OLLAMA_NUM_PARALLEL=1 \
            -e OLLAMA_MAX_LOADED_MODELS=1 \
            -e OLLAMA_KEEP_ALIVE=15m \
            ollama/ollama:"${OLLAMA_VERSION}"
          for _ in $(seq 1 60); do
            if curl -fsS "$OLLAMA_URL/api/tags" > /dev/null; then
              echo "Ollama is serving on $OLLAMA_URL"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Ollama did not become ready within 120s"
          docker logs ollama || true
          exit 1

      - name: Ensure the model is on disk
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if curl -fsS "$OLLAMA_URL/api/show" -d "{\"name\":\"$OLLAMA_MODEL\"}" > /dev/null 2>&1; then
            echo "::notice::$OLLAMA_MODEL restored from cache"
            exit 0
          fi
          echo "Pulling $OLLAMA_MODEL (first run only; later runs restore it from cache)"
          curl -fsS --max-time 1200 "$OLLAMA_URL/api/pull" \
            -d "{\"model\":\"$OLLAMA_MODEL\",\"stream\":false}" > /dev/null

      # pr-agent 0.49.0 declares requires-python >=3.12, while the app itself
      # still runs on 3.11 - so this job pins its own interpreter.
      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip wheels
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-pr-agent-${{ env.PR_AGENT_VERSION }}

      # The `github` extra is not in the base wheel: without it the provider
      # cannot import PyGithub and no comment can be posted.
      - name: Install PR-Agent
        if: steps.gate.outputs.skip != 'true'
        run: python -m pip install --no-input "pr-agent[github]==$PR_AGENT_VERSION"

      # Fail on a broken model in seconds instead of after a full CPU review.
      # `pr-agent doctor` passes only if the model id resolves, the provider key
      # check passes and a one-token completion comes back.
      - name: Check the model answers
        if: steps.gate.outputs.skip != 'true'
        env:
          CONFIG__MODEL: ollama/${{ env.OLLAMA_MODEL }}
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: ${{ env.PR_AGENT_MAX_TOKENS }}
          OLLAMA_API_BASE: ${{ env.OLLAMA_URL }}
          # Ollama has no authentication. PR-Agent only insists that the value
          # exists, so this literal satisfies the check; it is not a credential.
          OLLAMA_API_KEY: ollama
        run: pr-agent doctor

      - name: Review
        if: steps.gate.outputs.skip != 'true'
        env:
          GITHUB__USER_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.gate.outputs.pr_url }}
          COMMAND: ${{ steps.gate.outputs.command }}
          QUESTION: ${{ steps.gate.outputs.question }}
          CONFIG__MODEL: ollama/${{ env.OLLAMA_MODEL }}
          # A local model is not in PR-Agent's token table, so it aborts unless
          # this is set. It doubles as the diff budget: past it, PR-Agent prunes
          # the diff to the most relevant hunks instead of overflowing the
          # window that OLLAMA_CONTEXT_LENGTH defines above.
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: ${{ env.PR_AGENT_MAX_TOKENS }}
          # Never fall back: PR-Agent's shipped fallback is a hosted OpenAI
          # model, which would either bill us or fail on a key we do not have.
          CONFIG__FALLBACK_MODELS: "[]"
          OLLAMA_API_BASE: ${{ env.OLLAMA_URL }}
          OLLAMA_API_KEY: ollama
          # litellm gives up after 120s by default. At the measured ~13.7
          # tokens/second of prefill on a 4 vCPU runner, a full-budget prompt
          # needs ~20 minutes before it emits a token - so the default produced
          # "Failed to review PR" after two silent timeouts, with a green check
          # on the job.
          CONFIG__AI_TIMEOUT: "1800"
          # ... and because a failed review still exits 0 by default, surface it
          # as a failed job instead of a comment nobody notices.
          CONFIG__PROPAGATE_TOOL_ERRORS: "true"
          # Three findings is about all a 7B model can support without padding
          # the comment with restatements of the diff.
          PR_REVIEWER__NUM_MAX_FINDINGS: "3"
          PR_REVIEWER__EXTRA_INSTRUCTIONS: |
            This is a Python service that trades real money against third-party
            APIs. Rank findings by blast radius, not by style, and check in this
            order:
              1. ai_engine/** - model output is untrusted. Malformed JSON, a
                 missing field or a prompt-injection string must not raise,
                 silently change a verdict, or leak the API key.
              2. core/scoring.py - veto precedence is contractual; size stays
                 monotonic in the blended score.
              3. bot/** - one token failure must never abort a cycle; a dry run
                 persists and sends nothing.
              4. storage/** - schema changes need a migration and version bump;
                 SQL is parameterised; Parquet writes are idempotent.
              5. tests/** - hermetic: no network, no real credentials, no writes
                 outside tmp_path.
              6. .github/** - no secrets, no over-broad permissions.
            Report only defects you can point at in the diff. No praise, and no
            summary of what the diff already says.
        run: |
          set -euo pipefail
          args=("$COMMAND")
          if [ "$COMMAND" = "ask" ] && [ -n "$QUESTION" ]; then
            # PR-Agent treats any argument starting with `--` as a settings
            # override, strips the hyphens and applies the rest as
            # `key=value` - so `/ask --why is scoring wrong?` would reach the
            # model as `why is scoring wrong?`. Its own wire format for user
            # text is this prefix plus percent-encoding, which PRQuestions
            # decodes back verbatim before the prompt is built.
            encoded="$(QUESTION="$QUESTION" python -c 'import os, urllib.parse; print("__pr_agent_encoded_text__:" + urllib.parse.quote(os.environ["QUESTION"], safe=""))')"
            args=(ask "$encoded")
          fi
          pr-agent --pr_url="$PR_URL" "${args[@]}"

      # A failed review leaves a bare "Failed to review PR" comment behind, and
      # a later successful run replaces the guide but not that line - so a green
      # PR keeps carrying a stale failure notice. The same is true of PR-Agent's
      # temporary "Preparing review..." comment when a run is cancelled mid-way,
      # which is exactly what a push during a 25-minute review does. Delete both
      # kinds once the review has actually succeeded. No status function in
      # `if:`, so it is still gated on the review step having passed.
      - name: Drop stale bot comments
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.gate.outputs.pr_url }}
        run: |
          set -euo pipefail
          pr="${PR_URL##*/}"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]"
                    and (.body == "Failed to review PR"
                         or (.body | startswith("Preparing review"))
                         or (.body | startswith("Preparing answer")))) | .id' |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
            done

      - name: Show the model server log on failure
        if: failure() && steps.gate.outputs.skip != 'true'
        run: docker logs --tail 100 ollama || true

      # The container runs as root, and Ollama writes its manifests 0600, so the
      # cache post-step - which runs as the runner user - would fail to read them
      # ("Cannot open: Permission denied") and never save the 4.7 GB it just
      # downloaded. This must stay the last step: post steps run after it.
      - name: Make the model cache readable
        if: always() && steps.gate.outputs.skip != 'true'
        run: sudo chmod -R a+rX "$HOME/.ollama"
